  per_work: 1
  limit: 1
  steps: 4
  backend: auto
  max_factor_entries: 2000000
  max_workspace_mib: 512
benchmarks:
  trials: 8
listening:
  limit: 2
  methods: [one_shot_joint, tri_direct, smc_4]
